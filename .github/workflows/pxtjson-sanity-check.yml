---
name: "Sanity check pxt.json"

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    files_exist:
        name: "pxt.json only references existing files"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Every path in .files exists on disk
              run: |
                  set -euo pipefail
                  # Read into a variable first: piping jq straight into the loop would
                  # let a jq failure look like "no files to check" and pass vacuously.
                  listed=$(jq -er '.files[]' pxt.json)
                  [ -n "$listed" ] || { echo "::error::pxt.json files[] is empty"; exit 1; }
                  missing=0
                  while IFS= read -r f; do
                      if [ ! -f "$f" ]; then
                          echo "::error file=pxt.json::listed in files[] but missing on disk: $f"
                          missing=1
                      fi
                  done <<< "$listed"
                  exit $missing

    tutorials_listed:
        name: "pxt.json includes every tutorial"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Every curriculum/*.md appears in .files
              run: |
                  diff \
                    <(jq -r '.files[] | select(startswith("curriculum/"))' pxt.json | sort) \
                    <(find curriculum -maxdepth 1 -name '*.md' | sed 's_^\./__' | sort) \
                    || {
                        echo "::error file=pxt.json::curriculum tutorials and files[] disagree (< = in pxt.json only, > = on disk only)"
                        exit 1
                    }

    pin_in_sync:
        name: "Tutorial dependency pin matches pxt.json major version"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Tutorials pin the extension they teach. Only the major version must
            # match, so tutorial-only fixes can ship without moving the pin. Note
            # the snippet tests compile against local source, not the pinned tag:
            # a tutorial using a block newer than its pin will not be caught here.
            - name: Pins agree, exist, and share .version's major
              run: |
                  set -euo pipefail
                  version=$(jq -er '.version' pxt.json)
                  found=$(grep -ho 'pxt-climate-action#v[0-9.]*' curriculum/*.md | sort -u)
                  fix="Run: sed -i \"s|pxt-climate-action#v[0-9.]*|pxt-climate-action#v${version}|g\" curriculum/*.md"
                  if [ "$(wc -l <<< "$found")" -ne 1 ]; then
                      echo "::error::curriculum pins more than one version:"
                      echo "$found"
                      echo "$fix"
                      exit 1
                  fi
                  pinned=${found#*#v}
                  if [ "${pinned%%.*}" != "${version%%.*}" ]; then
                      echo "::error file=pxt.json::pxt.json is v${version} but curriculum pins v${pinned} (major differs)"
                      echo "$fix"
                      exit 1
                  fi
                  if [ -z "$(git ls-remote --tags origin "refs/tags/v${pinned}")" ]; then
                      echo "::error::curriculum pins v${pinned}, which is not a tag on origin"
                      exit 1
                  fi
                  if [ "$pinned" != "$version" ]; then
                      echo "::warning::curriculum pins v${pinned}, pxt.json is v${version}. Fine for tutorial-only changes."
                  fi
                  echo "All tutorials pin v${pinned}"
